name: Daily firmware check

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Shared with "ClickUp updates" so the two never push at the same time.
concurrency:
  group: firmware-site
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pypdf beautifulsoup4

      # Every scraper, the version cross-check, the disappearance check and
      # the site build, in order. The failed step is named at the bottom.
      - name: Full refresh
        run: python run_pipeline.py

      - name: Commit updated data
        run: |
          git config user.name "firmware-bot"
          git config user.email "bot@users.noreply.github.com"
          git add $(python run_pipeline.py --data-files)
          git diff --staged --quiet || git commit -m "Daily firmware check"
          git push
